name: Snapserver version

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(sed -nE 's/^ARG SNAPCAST_VERSION=(.+)$/\1/p' Dockerfile)
          release=$(gh api repos/badaix/snapcast/releases/latest)
          latest=$(jq -r '.tag_name | ltrimstr("v")' <<<"$release")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Pinned: $current, latest: $latest"

          if [ "$current" = "$latest" ]; then
            echo "outdated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The image needs the trixie pipewire build for every arch the Dockerfile supports.
          missing=""
          for arch in amd64 arm64 armhf; do
            deb="snapserver_${latest}-1_${arch}_trixie_with-pipewire.deb"
            jq -e --arg n "$deb" 'any(.assets[]; .name == $n)' <<<"$release" >/dev/null || missing="$missing $deb"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Snapserver $latest is out but missing assets:$missing"
            echo "outdated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Snapserver $current is outdated; latest is $latest"
          echo "outdated=true" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^ARG SNAPCAST_VERSION=.+$/ARG SNAPCAST_VERSION=${latest}/" Dockerfile

      - if: steps.versions.outputs.outdated == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image (asserts pipewire linkage)
        if: steps.versions.outputs.outdated == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha

      - if: steps.versions.outputs.outdated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT lets the PR trigger CI; GITHUB_TOKEN works but its PRs don't run checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          base: develop
          branch: chore/snapserver-${{ steps.versions.outputs.latest }}
          commit-message: "chore(deps): bump Snapserver to ${{ steps.versions.outputs.latest }}"
          title: "chore(deps): bump Snapserver to ${{ steps.versions.outputs.latest }}"
          body: |
            Bumps `SNAPCAST_VERSION` from `${{ steps.versions.outputs.current }}` to `${{ steps.versions.outputs.latest }}`.

            Release notes: https://github.com/badaix/snapcast/releases/tag/v${{ steps.versions.outputs.latest }}

            The amd64 image built successfully with the new `.deb`, including the pipewire linkage check.
          delete-branch: true
