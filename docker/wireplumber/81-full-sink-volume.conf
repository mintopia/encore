# New hardware sinks start at full volume so Spotify's volume is the only control.
# WirePlumber's default is 0.4^3 (~-24 dB), and its state dir isn't persisted, so
# without this every container recreate drops the output back to ~-24 dB.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
}
